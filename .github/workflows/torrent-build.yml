name: Torrent Build

on:
  push:
    paths:
      - "torrent/**"
      - ".github/workflows/torrent-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: torrent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-torrent-${{ runner.os }}-${{ hashFiles('torrent/**/*.gradle*', 'torrent/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-torrent-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enya-torrent-debug-apk
          path: torrent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Commit built APK back to the repo
        working-directory: .
        run: |
          mkdir -p dist
          cp torrent/app/build/outputs/apk/debug/app-universal-debug.apk dist/enya-torrent-debug.apk
          cp torrent/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/enya-torrent-arm64-debug.apk
          cp torrent/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk dist/enya-torrent-armv7-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/enya-torrent-debug.apk dist/enya-torrent-arm64-debug.apk dist/enya-torrent-armv7-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: update built torrent debug APK"
            git push
          fi
